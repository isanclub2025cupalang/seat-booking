<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - จัดการการจองพาแลง 2569</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root { 
      --primary: #b52c58; 
      --secondary: #d68c2d; 
      --bg: #fdfaf0; 
      --danger: #ff7675;
    }
    body { font-family: 'Kanit', sans-serif; background: var(--bg); padding: 20px; margin: 0; }
    .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    h2 { color: var(--primary); text-align: center; margin-bottom: 25px; }
    
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
    .card { background: var(--bg); padding: 20px; border-radius: 15px; text-align: center; border: 1px solid #eee; }
    .card h3 { margin: 0; color: var(--secondary); font-size: 1rem; }
    .card p { font-size: 1.5rem; font-weight: bold; margin: 10px 0 0 0; color: var(--primary); }
    
    .actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .btn-excel { background: #27ae60; color: white; border: none; padding: 12px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.3s; }
    .btn-excel:hover { background: #219150; transform: translateY(-2px); }
    
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; }
    th, td { padding: 15px; border-bottom: 1px solid #eee; text-align: left; }
    th { background: var(--primary); color: white; font-weight: 400; }
    tr:hover { background: #fdfaf0; }
    
    .btn-view { background: var(--secondary); color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    .btn-delete { background: var(--danger); color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; margin-left: 5px; }
    .btn-delete:hover { background: #d63031; }

    @media (max-width: 600px) {
      .stats { grid-template-columns: 1fr; }
      th:nth-child(3), td:nth-child(3) { display: none; } /* ซ่อนเบอร์โทรในมือถือถ้าจอแคบ */
    }
  </style>
</head>
<body>

<div class="container">
  <h2>📊 ระบบจัดการหลังบ้าน - พาแลง 2569</h2>
  
  <div class="stats">
    <div class="card"><h3>จำนวนที่นั่งที่จอง</h3><p id="totalSeats">0 / 35</p></div>
    <div class="card"><h3>ยอดเงินรวมทั้งหมด</h3><p id="totalRevenue">0 บาท</p></div>
  </div>

  <div class="actions">
    <button onclick="exportToExcel()" class="btn-excel">📊 ดาวน์โหลดไฟล์ Excel (CSV)</button>
    <span style="font-size: 0.8rem; color: #666;">* ข้อมูลเรียงตามเลขที่นั่ง</span>
  </div>

  <table id="adminTable">
    <thead>
      <tr>
        <th>ที่นั่ง</th>
        <th>ชื่อผู้จอง</th>
        <th>เบอร์โทรศัพท์</th>
        <th>จัดการ</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <tr><td colspan="4" style="text-align:center;">กำลังโหลดข้อมูล...</td></tr>
    </tbody>
  </table>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot, query, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

  // 🚩 Firebase Config ของคุณ
  const firebaseConfig = {
    apiKey: "AIzaSyD34kENWYBmQsjefAVNyisVq-U2V5ej8b4",
    authDomain: "seat-booking-757dc.firebaseapp.com",
    projectId: "seat-booking-757dc",
    storageBucket: "seat-booking-757dc.firebasestorage.app",
    messagingSenderId: "247801765305",
    appId: "1:247801765305:web:b301a58aee401195706a68"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ดึงข้อมูลและอัปเดตแบบ Real-time
  onSnapshot(query(collection(db, "bookings")), (snapshot) => {
    let bookings = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));

    // ✅ 1. เรียงลำดับที่นั่ง (A1 -> A2 -> B1)
    bookings.sort((a, b) => a.seat.localeCompare(b.seat, undefined, { numeric: true }));

    renderTable(bookings);
    updateStats(bookings);
  });

  // ฟังก์ชันวาดตาราง
  function renderTable(data) {
    const tbody = document.getElementById("tableBody");
    if (data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">ยังไม่มีข้อมูลการจอง</td></tr>';
      return;
    }
    tbody.innerHTML = data.map(b => `
      <tr>
        <td><strong style="color:var(--primary)">${b.seat}</strong></td>
        <td>${b.name}</td>
        <td>${b.phone}</td>
        <td>
          <button class="btn-view" onclick="window.open('${b.slipBase64}')">สลิป</button>
          <button class="btn-delete" onclick="deleteBooking('${b.id}', '${b.seat}')">ลบ</button>
        </td>
      </tr>
    `).join("");
  }

  // อัปเดตยอดสรุป
  function updateStats(data) {
    document.getElementById("totalSeats").innerText = data.length + " / 21";
    document.getElementById("totalRevenue").innerText = (data.length * 699).toLocaleString() + " บาท";
  }

  // ✅ 2. ฟังก์ชันลบข้อมูล (คืนที่นั่งว่าง)
  window.deleteBooking = async (id, seatNo) => {
    if (confirm(`ยืนยันการลบที่นั่ง ${seatNo} ใช่ไหม? ข้อมูลจะหายถาวรและที่นั่งจะว่างทันที`)) {
      try {
        await deleteDoc(doc(db, "bookings", id));
      } catch (e) {
        alert("ลบไม่สำเร็จ: " + e.message);
      }
    }
  };

  // ✅ 3. ฟังก์ชันส่งออกไฟล์ Excel (CSV ภาษาไทย)
  window.exportToExcel = () => {
    const table = document.getElementById("adminTable");
    let rows = Array.from(table.querySelectorAll("tr"));
    let csvContent = "\uFEFF"; // ป้องกันภาษาไทยต่างดาวใน Excel

    rows.forEach(row => {
      // เอาแค่ 3 คอลัมน์แรก (ไม่เอาปุ่มจัดการ)
      const cols = Array.from(row.querySelectorAll("th, td")).slice(0, 3).map(c => `"${c.innerText.trim()}"`);
      csvContent += cols.join(",") + "\n";
    });

    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "รายชื่อจองพาแลง_2569_อัปเดต.csv";
    link.click();
  };
</script>

</body>
</html>
