<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Admin - จัดการการจองพาแลง</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #b52c58; --secondary: #d68c2d; --bg: #fdfaf0; }
    body { font-family: 'Kanit', sans-serif; background: var(--bg); padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    h2 { color: var(--primary); text-align: center; }
    
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .card { background: var(--bg); padding: 20px; border-radius: 15px; text-align: center; border: 1px solid #eee; }
    .card h3 { margin: 0; color: var(--secondary); }
    
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 12px; border: 1px solid #eee; text-align: left; }
    th { background: var(--primary); color: white; }
    
    .btn-excel { background: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
    .btn-view { background: var(--secondary); color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <h2>📊 ระบบจัดการหลังบ้าน - พาแลง</h2>
  
  <div class="stats">
    <div class="card"><h3>ที่นั่งที่จองแล้ว</h3><p id="totalSeats">0 / 21</p></div>
    <div class="card"><h3>ยอดเงินรวม</h3><p id="totalRevenue">0 บาท</p></div>
  </div>

  <button onclick="exportToExcel()" class="btn-excel">📊 ดาวน์โหลดรายชื่อ (Excel)</button>

  <table id="adminTable">
    <thead>
      <tr>
        <th>ที่นั่ง</th>
        <th>ชื่อผู้จอง</th>
        <th>เบอร์โทร</th>
        <th>สลิป</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      </tbody>
  </table>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot, query } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD34kENWYBmQsjefAVNyisVq-U2V5ej8b4",
    authDomain: "seat-booking-757dc.firebaseapp.com",
    projectId: "seat-booking-757dc",
    storageBucket: "seat-booking-757dc.firebasestorage.app",
    messagingSenderId: "247801765305",
    appId: "1:247801765305:web:b301a58aee401195706a68"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  onSnapshot(query(collection(db, "bookings")), (snapshot) => {
    let bookings = snapshot.docs.map(doc => doc.data());

    // 🆕 1. เรียงลำดับตามเลขที่นั่ง (A1, A2, B1...)
    bookings.sort((a, b) => a.seat.localeCompare(b.seat, undefined, { numeric: true }));

    renderTable(bookings);
    updateStats(bookings);
  });

  function renderTable(data) {
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = data.map(b => `
      <tr>
        <td><strong>${b.seat}</strong></td>
        <td>${b.name}</td>
        <td>${b.phone}</td>
        <td><button class="btn-view" onclick="window.open('${b.slipBase64}')">ดูสลิป</button></td>
      </tr>
    `).join("");
  }

  function updateStats(data) {
    document.getElementById("totalSeats").innerText = data.length + " / 21";
    document.getElementById("totalRevenue").innerText = (data.length * 699).toLocaleString() + " บาท";
  }

  // 🆕 2. ฟังก์ชันส่งออกเป็น Excel (CSV)
  window.exportToExcel = () => {
    const table = document.getElementById("adminTable");
    let rows = Array.from(table.querySelectorAll("tr"));
    let csvContent = "\uFEFF"; // เติม BOM ให้ Excel อ่านภาษาไทยออก

    rows.forEach(row => {
      const cols = Array.from(row.querySelectorAll("th, td")).map(c => `"${c.innerText.trim()}"`);
      csvContent += cols.join(",") + "\n";
    });

    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "รายชื่อจองพาแลง_2569.csv";
    link.click();
  };
</script>
</body>
</html>
